<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Peggy Sim 2020</title>
    <link rel="shortcut icon" href="WebGL/PeggySim/TemplateData/favicon.ico" />
    <style>
      html {
        background: url("images/background.jpg"), #000;
        background-size: 300px auto;
      }
      .main-container {
        width: max-content;
        box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.2);
        min-height: 100px;
        margin: 10px auto;
        background-color: #fff;
      }
      .title {
        font-family: Monospace;
        text-align: center;
        padding: 20px;
        width: 100%;
      }
      .foot {
        height: 50px;
        display: flex;
        align-items: center;
      }
      .full-button {
        width: 50px;
        height: 50px;
        background: url("images/fullscreen.svg"), #449 no-repeat;
        background-size: 60% 60%;
        background-repeat: no-repeat;
        background-position: center center;
        transition: all 0.2s;
        border: none;
        cursor: pointer;
      }
      .full-button:hover {
        background: url("images/fullscreen.svg"), #55a no-repeat;
        background-size: 80% 80%;
        background-repeat: no-repeat;
        background-position: center center;
      }
      .full-screen-text {
        font-size: 18px;
        font-family: Monospace;
        padding: 10px;
      }
      .webgl-wrap {
        position: relative;
        width: 960px;
        height: 600px;
        background: #231f20;
      }
      #unity-canvas {
        width: 960px;
        height: 600px;
        display: block;
      }
      #loading {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 300px;
        transform: translate(-50%, -50%);
        font-family: Monospace;
        color: #fff;
        text-align: center;
      }
      #loading-bar {
        height: 12px;
        margin-top: 10px;
        border: 2px solid #fff;
      }
      #loading-fill {
        width: 0;
        height: 100%;
        background: #fff;
      }
    </style>
  </head>
  <body class="main-container">
    <h1 class="title">Peggy Simulator 2020</h1>
    <div class="webgl-wrap">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="loading">
        <div id="loading-text">Loading...</div>
        <div id="loading-bar"><div id="loading-fill"></div></div>
      </div>
    </div>
    <div class="foot">
      <button class="full-button" aria-label="Full screen" onclick="unityInstance && unityInstance.SetFullscreen(1)"></button>
      <p class="full-screen-text">Full Screen</p>
    </div>

    <script src="WebGL/PeggySim/Build/PeggySim.loader.js"></script>
    <script>
      // File names follow the build's compression settings: Gzip with decompression
      // fallback produces .unityweb files. Update these if those settings change.
      var buildUrl = "WebGL/PeggySim/Build";
      var unityInstance = null;
      var loading = document.querySelector("#loading");

      createUnityInstance(
        document.querySelector("#unity-canvas"),
        {
          dataUrl: buildUrl + "/PeggySim.data.unityweb",
          frameworkUrl: buildUrl + "/PeggySim.framework.js.unityweb",
          codeUrl: buildUrl + "/PeggySim.wasm.unityweb",
          streamingAssetsUrl: "WebGL/PeggySim/StreamingAssets",
          companyName: "DefaultCompany",
          productName: "PeggySim",
          productVersion: "1.0",
        },
        function (progress) {
          document.querySelector("#loading-fill").style.width = 100 * progress + "%";
        }
      )
        .then(function (instance) {
          unityInstance = instance;
          loading.style.display = "none";
        })
        .catch(function (error) {
          document.querySelector("#loading-text").textContent = "Couldn't load the game: " + error;
        });
    </script>
  </body>
</html>
